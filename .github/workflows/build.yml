name: Sojourn

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sojourn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download dependencies
        run: npm ci

      - name: Lint repo
        run: npm run lint

      - name: Typecheck repo
        run: npm run check

      - name: Test repo
        run: npm run test

  backend:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: backend/src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/src/go.mod
          cache-dependency-path: backend/src/go.sum

      - name: Check formatting
        run: gofmt -l .

      - name: Vet repo
        run: go vet ./...

      - name: Test repo
        run: go test ./...

  build:
    needs: [frontend, backend]
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build image
        run: docker build --pull -t sojourn:${{ github.sha }} .
