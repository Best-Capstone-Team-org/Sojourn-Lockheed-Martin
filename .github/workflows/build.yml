name: Sojourn

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sojourn-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Download dependencies
        run: npm ci

      - name: Lint repo
        run: npm run lint

      - name: Typecheck repo
        run: npm run check

      - name: Test repo
        run: npm run test

  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: backend/src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/src/go.mod
          cache-dependency-path: backend/src/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet repo
        run: go vet ./...

      - name: Test repo
        run: go test -coverprofile=coverage.out ./...

      - name: Coverage report
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ../../.github/workflows/scripts/coverage-report.sh coverage.out "$HEAD_SHA"

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = require('./.github/workflows/scripts/coverage-comment.js');
            await comment({ github, context, path: 'backend/src/coverage.md' });

  build:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build --pull -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: docker push --all-tags "$IMAGE"

      - name: Check image size
        run: .github/workflows/scripts/check-image-size.sh "$IMAGE:${{ github.sha }}"
