name: sojourn

volumes:
  player_data:
  scenario_data:

services:
  sojourn:
    build: .
    container_name: sojourn
    environment:
      - BUILD_DIR=/app/frontend
      - SCENARIOS_DIR=/app/scenarios
      - SCENARIOS_USER_DIR=/app/scenarios-user
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - scenario_data:/app/scenarios-user:ro