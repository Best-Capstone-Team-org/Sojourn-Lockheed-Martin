<!doctype html>
<html
	lang="en"
	class="noise-bg m-0 min-h-full text-sys-green"
>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>
		<meta
			name="text-scale"
			content="scale"
		/>
		<link
			rel="preconnect"
			href="https://fonts.googleapis.com"
		/>
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Electrolize&family=Quantico:ital,wght@0,400;0,700;1,400;1,700&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="electrolize-regular m-0 min-h-full bg-sys-medium-grey text-sys-green"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
